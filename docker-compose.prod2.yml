services:
  # 1. Frontend
  frontend:
    image: 123rkdduswn/joinflix-front:latest
    container_name: frontend-joinflix
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/live/joinflix.co.kr/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/joinflix.co.kr/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - backend
    networks:
      - joinflix-network

  # 2. Backend (Spring Boot)
  backend:
    image: 123rkdduswn/joinflix-back:latest
    container_name: backend-joinflix
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - joinflix-network

  # 3. Redis
  redis:
    image: "redis:7.2.1-alpine"
    container_name: redis-joinflix
    command: redis-server --appendonly yes
    networks:
      - joinflix-network

  # 4. MySQL (Database)
  mysql:
    image: "mysql:8.0"
    container_name: mysql-joinflix
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: "joinflix"
      TZ: "Asia/Seoul"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - joinflix-network

